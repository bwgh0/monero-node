name: Deploy monero-node

# CI first, then EU, then US. Each box runs scripts/deploy.sh: back up the
# onion keys, check the box, deploy, check it again, and roll back to the
# previous commit when a check fails that passed before the deploy. US
# waits for a good EU deploy. A failure, or a check that already failed
# before the deploy and still fails, sends a Telegram message.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: "Region to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - eu
          - us

permissions:
  contents: read

# One deploy at a time. A new push waits. It never cancels a deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The iOS and Android apps have these names built in. They must never change.
  # The deploy checks that each box serves its name with the same key as before.
  ONION_EU: zu3oyzi45x3ul24sncs4245nlpz76jzizm36tvrkfvq2r33azzjv5syd.onion
  ONION_US: 5tvl5acn3sm7id4gzc4mj6n7lrwlyrhssr2r57zkxk6eugxwix4ze4qd.onion

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-eu:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.region == 'all' || inputs.region == 'eu')
    runs-on: ubuntu-24.04
    environment: production-eu
    timeout-minutes: 50
    outputs:
      rc: ${{ steps.deploy.outputs.rc }}
      already_failing: ${{ steps.deploy.outputs.already_failing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Deploy to EU, check it, roll back on failure
        id: deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_EU }}
          KNOWN_HOSTS: .github/known_hosts
        run: scripts/deploy-ssh.sh eu.node.monero.one eu.node.monero.one "$ONION_EU" "$GITHUB_SHA"

  deploy-us:
    needs: [ci, deploy-eu]
    # A push or "all" needs a good EU deploy first. "us" alone skips EU.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      (github.event_name == 'push' || inputs.region == 'all' || inputs.region == 'us') &&
      (needs.deploy-eu.result == 'success' ||
       (inputs.region == 'us' && needs.deploy-eu.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: production-us
    timeout-minutes: 50
    outputs:
      rc: ${{ steps.deploy.outputs.rc }}
      already_failing: ${{ steps.deploy.outputs.already_failing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Deploy to US, check it, roll back on failure
        id: deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_US }}
          KNOWN_HOSTS: .github/known_hosts
        run: scripts/deploy-ssh.sh us.node.monero.one us.node.monero.one "$ONION_US" "$GITHUB_SHA"

  notify:
    needs: [ci, deploy-eu, deploy-us]
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
       needs.deploy-eu.outputs.already_failing != '' || needs.deploy-us.outputs.already_failing != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send the failure to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_RESULT: ${{ needs.ci.result }}
          EU_RESULT: ${{ needs.deploy-eu.result }}
          EU_RC: ${{ needs.deploy-eu.outputs.rc }}
          EU_KNOWN: ${{ needs.deploy-eu.outputs.already_failing }}
          US_RESULT: ${{ needs.deploy-us.result }}
          US_RC: ${{ needs.deploy-us.outputs.rc }}
          US_KNOWN: ${{ needs.deploy-us.outputs.already_failing }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z $TELEGRAM_BOT_TOKEN || -z $TELEGRAM_CHAT_ID ]]; then
            echo "::error::Set the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets. No alert went out."
            exit 1
          fi
          # GitHub hides each secret as a whole. Hide these values again, so
          # they stay hidden in any form, also in the bot<token> URL.
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          echo "::add-mask::$TELEGRAM_CHAT_ID"
          result() {
            case $1/$2 in
              success/*) echo "deployed" ;;
              skipped/*) echo "not deployed" ;;
              cancelled/*) echo "cancelled. A deploy that started on the box runs to its end. See the run log." ;;
              failure/1) echo "FAILED, rolled back. After the rollback, every check passed that passed before the deploy." ;;
              failure/2) echo "FAILED, and the ROLLBACK FAILED. The box needs a person now." ;;
              failure/3) echo "stopped before any change" ;;
              failure/4) echo "did not start (SSH)" ;;
              *) echo "$1, no result from the box. See the run log." ;;
            esac
          }
          # Checks that failed before the deploy and still fail. They cause
          # no rollback, because the deploy may be their fix.
          known() {
            if [[ -n $1 ]]; then
              echo " Already failing before the deploy, so no rollback for these: $1"
            fi
          }
          text="monero-node deploy: action needed
          Commit: ${GITHUB_SHA::7} ${COMMIT_MESSAGE%%$'\n'*}
          CI: $CI_RESULT
          EU: $(result "$EU_RESULT" "$EU_RC")$(known "$EU_KNOWN")
          US: $(result "$US_RESULT" "$US_RC")$(known "$US_KNOWN")
          $RUN_URL"
          curl -sS --fail --max-time 20 -o /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
