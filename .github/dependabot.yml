# Weekly update PRs for the images in docker-compose.yml and for the
# GitHub Actions. Nothing merges on its own: CI runs on each PR, and a
# merge to main deploys. docs/monitoring.md has the rules for these PRs.
#
# - The minor and patch updates of the monitoring images come in one PR.
# - monerod is never in a group. The deploy refuses a monerod image change
#   that ships with a change to another service, and a monerod bump skips
#   the automatic rollback (deploy.sh exit 5). Merge a monerod PR alone,
#   and wait for its deploy to finish before you merge the next PR.
# - Each other image comes in its own PR. grafana is not in the monitoring
#   group, so a grafana update always deploys alone.
# - grafana gets PRs only for minor and patch versions. A major version
#   can migrate grafana-data one way, so plan it by hand (docs/monitoring.md).
# - nginx: the even minors (1.30, 1.32) are the stable lines, and the odd
#   minors are mainline. Add each new odd minor to the ignore list.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        versions: [">= 1.31, < 1.32"]
    groups:
      monitoring:
        patterns:
          - "prom/prometheus"
          - "prom/blackbox-exporter"
          - "prom/node-exporter"
          - "utxobr/monero-exporter"
        exclude-patterns:
          - "*simple-monerod*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
