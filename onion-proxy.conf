# Onion proxy for the Tor onion service.
#
# Tor hands each onion connection to this nginx over a unix socket on the
# onion-sock volume. A socket path does not change when a container gets a
# new IP, so a recreated container never leaves Tor pointing at a dead IP.
#
# TLS clients pass through to monerod as is (TCP passthrough).
# Plain HTTP clients go to the http block below, which calls monerod over TLS.
# Both paths reach only the restricted RPC (monerod:18089). Never 18081.
#
# monerod counts RPC connections per source IP. All onion traffic comes from
# this container's IP, so monerod runs with a higher per-private-IP limit.

worker_processes 2;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # Docker DNS. Names resolve per connection, so a recreated monerod
    # with a new IP keeps working without a proxy restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # An empty protocol means the client sent no TLS ClientHello.
    map $ssl_preread_protocol $onion_upstream {
        ""      unix:/run/nginx-plain.sock;  # plain HTTP: http block below
        default monerod:18089;               # TLS: monerod restricted RPC
    }

    server {
        listen unix:/run/onion/monerod.sock;
        ssl_preread on;
        preread_timeout 30s;
        proxy_pass $onion_upstream;
        proxy_connect_timeout 10s;
        # Idle time before an open connection closes. Longer than the
        # proxy_read_timeout below, so a slow RPC call is not cut.
        proxy_timeout 600s;
    }
}

http {
    # Zero-log: nothing about onion clients is written anywhere
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Tor is slow, so give clients time
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 120s;
    keepalive_timeout 120s;

    # monerod rejects requests over 1 MiB (MAX_RPC_CONTENT_LENGTH)
    client_max_body_size 1m;

    # Connection counts for scripts/capacity-metrics.sh (loopback, read
    # through nsenter). The counters also cover the stream block above.
    server {
        listen 127.0.0.1:8081;
        location = /status {
            stub_status;
        }
    }

    server {
        listen unix:/run/nginx-plain.sock;

        location / {
            set $monerod https://monerod:18089;
            proxy_pass $monerod;
            proxy_http_version 1.1;

            # Internal hop. The cert names the public domain, not "monerod".
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_ssl_session_reuse on;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;

            # Read big binary replies (get_blocks.bin) into memory quickly, so
            # the monerod connection is free while Tor sends them slowly.
            # Up to 4 MiB per request. Past that, nginx reads from monerod
            # only as fast as the client takes the data. No temp files.
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 64 64k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;

            # Finish the monerod call even when the Tor client goes away,
            # so monerod always sees a clean close. Never retry a call.
            proxy_ignore_client_abort on;
            proxy_next_upstream off;
        }
    }
}
