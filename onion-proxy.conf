# Onion proxy for the Tor onion service.
#
# Tor hands each onion connection to this nginx over a unix socket on the
# onion-sock volume. A socket path does not change when a container gets a
# new IP, so a recreated container never leaves Tor pointing at a dead IP.
#
# Plain HTTP and TLS clients use the same onion port. The stream block sends
# each one to the http server below, and that server ends TLS with the same
# Let's Encrypt cert that monerod serves. So every onion request goes through
# one pool of TLS sockets to monerod. Only the restricted RPC
# (monerod:18089), never 18081.
#
# monerod counts RPC sockets per source IP, and all onion traffic comes from
# this container's IP (cap 50, --rpc-max-connections-per-private-ip). The
# pool keeps that count at 32 or less, however many Tor clients there are.
# A Tor client that drops in the middle of a reply never resets a monerod
# socket. Lab test 2026-10-18 (monerod v0.18.4.5): a reset during a reply
# holds a per-IP slot for up to 30 min (see monitoring/rpc-proxy.conf).
#
# The cert path holds the domain of the box as a template. scripts/deploy.sh
# render and scripts/setup.sh fill it in.

# One worker, so the pool below is one pool: monerod sees at most max_conns
# sockets from this IP. One worker carries far more than Tor can send.
worker_processes 1;
# Each Tor client takes 3 connections here (onion socket, stream hop, http),
# and each reply that goes to a temp file takes 1 file.
worker_rlimit_nofile 16384;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    # An empty protocol means the client sent no TLS ClientHello
    map $ssl_preread_protocol $onion_listener {
        ""      unix:/run/nginx-plain.sock;  # plain HTTP
        default unix:/run/nginx-tls.sock;    # TLS, ended by the http server
    }

    server {
        listen unix:/run/onion/monerod.sock;
        ssl_preread on;
        preread_timeout 30s;
        proxy_pass $onion_listener;
        proxy_connect_timeout 10s;
        # Idle time before an open connection closes. Longer than the
        # proxy_read_timeout below, so a slow RPC call is not cut.
        proxy_timeout 600s;
    }
}

http {
    # Zero-log: nothing about onion clients is written anywhere
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Tor is slow, so give clients time
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 120s;
    keepalive_timeout 120s;

    # monerod rejects requests over 1 MiB (MAX_RPC_CONTENT_LENGTH). The
    # largest transaction is about 150 kB, about 300 kB as hex in JSON.
    # nginx reads the whole body before it sends the request, so a slow
    # upload never holds a monerod socket.
    client_max_body_size 1m;

    # Connection counts for scripts/capacity-metrics.sh (loopback, read
    # through nsenter). The counters also cover the stream block above.
    server {
        listen 127.0.0.1:8081;
        location = /status {
            stub_status;
        }
    }

    # The pool of TLS sockets to monerod. monerod v0.18.4.5 leaks its per-IP
    # count when one IP opens many short connections (see
    # monitoring/rpc-proxy.conf), so the pool opens few and keeps them.
    upstream monerod_restricted {
        zone monerod_restricted 64k;
        # "resolve" follows a new monerod IP through the resolver above
        # (nginx 1.27.3 or later).
        # max_conns: at most 32 requests at monerod at a time, 18 under the
        # cap of 50. monerod serves 2 requests at a time (2 RPC threads), so
        # 32 is a deep queue. When 32 requests wait for monerod, nginx
        # answers the next request at once with a 502 ("no live upstreams"
        # in the error log), and monerod never sees it. Onion RPC
        # Connections High fires above 25 sockets, and Critical at 30.
        server monerod:18089 resolve max_conns=32;
        # Keep every pool socket when it goes idle: no new socket after a burst
        keepalive 32;
        # Close idle sockets before monerod does (30 min for private IPs)
        keepalive_timeout 300s;
        # Each socket close can leak one count of monerod's per-IP limit.
        # nginx closes a socket after 1 h by default, so keep them for days.
        keepalive_time 7d;
        keepalive_requests 10000000;
    }

    server {
        listen unix:/run/nginx-plain.sock;
        listen unix:/run/nginx-tls.sock ssl;

        # The cert of monerod (certbot-conf, read only), for any SNI.
        # nginx loads it at start and at "nginx -s reload". The daily cron
        # scripts/cert-reload.sh reloads it after a renewal.
        ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:onion_tls:10m;
        ssl_session_timeout 1h;

        location / {
            proxy_pass https://monerod_restricted;
            proxy_http_version 1.1;
            # An empty Connection header keeps the monerod connection open
            proxy_set_header Connection "";

            # Internal hop. The cert names the public domain, not "monerod".
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_ssl_session_reuse on;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            # Let slow replies finish, so a timeout does not cut a socket
            proxy_read_timeout 300s;

            # Finish the monerod call even when the Tor client goes away,
            # so monerod always sees a clean close. Never retry a call.
            proxy_ignore_client_abort on;
            proxy_next_upstream off;

            # Read each reply to the end at LAN speed, and keep the socket in
            # the pool. Then Tor gets the reply from here at its own pace.
            # proxy_ignore_client_abort covers only a client that goes away
            # while nginx waits for monerod. When a client goes away while
            # nginx sends the reply, nginx closes the monerod socket in the
            # middle of the reply, unless it stores the reply. So store each
            # reply: nginx writes it to a temp file and renames it to
            # last-reply (the last reply only). The temp files are on the
            # /var/cache/nginx tmpfs (1 GiB, docker-compose.yml). A reply that
            # Tor still sends keeps its file until the send ends: about 40
            # replies of 25 MB at the same time. The path must be on the same
            # tmpfs as proxy_temp, and nginx must own the directory.
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 16 64k;
            proxy_busy_buffers_size 256k;
            proxy_store /var/cache/nginx/proxy_temp/last-reply;
        }
    }
}
