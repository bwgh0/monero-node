worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Zero-log configuration — no client data written to disk
    access_log off;
    error_log /dev/stderr warn;

    # Hide nginx version from responses
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=rpc:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Max body size for RPC requests
    client_max_body_size 1m;

    # Default HTTP server — reject connections by IP or unknown Host header
    server {
        listen 80 default_server;
        return 444;
    }

    # HTTP — health checks, ACME challenge
    # (Port 443 is handled by monerod directly with native TLS)
    server {
        listen 80;
        server_name ${DOMAIN} node.monero.one;
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check — returns minimal 200/502 (does not expose get_info details)
        location = /health {
            set $backend http://monerod:18089;
            proxy_pass $backend/get_info;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @health_down;
        }

        location @health_down {
            return 503 '{"status":"ERROR"}';
            default_type application/json;
        }

        # Grafana — localhost only (access via SSH tunnel: ssh -L 3000:localhost:80 root@node)
        location /grafana/ {
            allow 127.0.0.1;
            allow ::1;
            deny all;

            limit_req zone=rpc burst=50 nodelay;
            limit_conn connlimit 10;

            # Security headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;

            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-Proto "http";
        }

        # Everything else — redirect to HTTPS (monerod on 443)
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
