# Public proxy for the clearnet RPC on ports 443 and 18089.
#
# Wallets connect here, not to monerod. nginx ends the client socket and TLS,
# and it sends all requests through one small pool of TLS sockets to the
# restricted RPC (monerod:18089). Only the restricted RPC, never 18081.
#
# Why: monerod counts RPC sockets per source IP, and its count can leak.
# The count goes down only when monerod frees the connection object, and
# some client resets keep that object alive after its socket is gone. Then
# monerod refuses an IP that holds no sockets, until a restart (US
# 2026-11-03 and 2026-11-04: all wallets behind one carrier IP). Here a client
# reset, abort or reconnect ends at nginx. monerod sees only the IP of this
# container and the long-lived sockets of the pool. onion-proxy.conf and
# monitoring/rpc-proxy.conf do the same for the onion and the exporter.
#
# The stream block counts the sockets of each client IP, as monerod did:
# 10 per public IP, 50 per private or loopback IP. Then it passes each
# connection over a unix socket to the http block, which ends TLS. So the
# http block sees "unix:" as the client, and no client IP can get into its
# log lines.
#
# The cert path holds the domain of the box as a template. scripts/deploy.sh
# render and scripts/setup.sh fill it in.

# One worker, so the pool below is one pool: monerod sees at most max_conns
# sockets from this IP. One worker carries far more than the boxes get
# (US peak 2026-11: 95 wallet sockets, 11 requests per second).
worker_processes 1;
# Each client takes 3 connections here (client socket, stream hop, http),
# and each reply that goes to a temp file takes 1 file.
worker_rlimit_nofile 32768;
pid /run/nginx.pid;

events {
    worker_connections 8192;
}

stream {
    # Zero-log: no line with a client IP. The stream lines name the client
    # IP, so only crit lines go out (for example "worker_connections are
    # not enough"). A refused socket logs at info, so it is not written.
    error_log /dev/stderr crit;
    limit_conn_log_level info;

    # The cap per client IP, as in monerod (is_host_limit): private and
    # loopback IPs get --rpc-max-connections-per-private-ip (50), public IPs
    # get --rpc-max-connections-per-public-ip (10). Homes, VPN exits and
    # carrier NAT share one IP, and each open wallet holds 1 socket.
    # IPv6 clients: the boxes have no AAAA record, and the Docker networks
    # have no IPv6. So docker-proxy hands each IPv6 client to nginx from the
    # network gateway, a private IP. They share the cap of 50, as they did
    # at monerod. scripts/capacity-metrics.sh reads the 2 numbers from the
    # limit_conn lines below.
    geo $rpc_private_ip {
        default        0;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        127.0.0.0/8    1;
        ::1/128        1;
        fc00::/7       1;
        fe80::/10      1;
    }
    # An empty key is not counted, so each IP falls in one zone only
    map $rpc_private_ip $rpc_public_key {
        0       $binary_remote_addr;
        default "";
    }
    map $rpc_private_ip $rpc_private_key {
        1       $binary_remote_addr;
        default "";
    }
    limit_conn_zone $rpc_public_key zone=public_ip:10m;
    limit_conn_zone $rpc_private_key zone=private_ip:1m;

    server {
        listen 443;
        listen 18089;
        limit_conn public_ip 10;
        limit_conn private_ip 50;
        proxy_pass unix:/run/nginx-tls.sock;
        proxy_connect_timeout 10s;
        # Idle time before an open connection closes. Longer than the
        # keepalive_timeout of the http block, so nginx closes an idle
        # wallet socket there first, with a clean close.
        proxy_timeout 600s;
    }
}

http {
    # Zero-log: nothing about clients is written anywhere. The clients of
    # this block are the stream hops ("unix:"), never an IP.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # As monerod: it closes an idle public socket after 5 minutes, and it
    # has no cap on the requests or the life of a socket. nginx closes a
    # client socket after 1000 requests or 1 h by default, and each close
    # makes the wallet open a new socket.
    keepalive_timeout 300s;
    keepalive_requests 10000000;
    keepalive_time 7d;
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 120s;

    # monerod rejects requests over 1 MiB (MAX_RPC_CONTENT_LENGTH). The
    # largest transaction is about 150 kB, about 300 kB as hex in JSON.
    # nginx reads the whole body before it sends the request, so a slow
    # upload never holds a monerod socket.
    client_max_body_size 1m;

    # Connection counts for scripts/capacity-metrics.sh (loopback, read
    # through nsenter). The counters also cover the stream block above.
    server {
        listen 127.0.0.1:8081;
        location = /status {
            stub_status;
        }
    }

    # The pool of TLS sockets to monerod. Each socket close can leak one
    # count of monerod's per-IP limit, so the pool opens few and keeps them.
    upstream monerod_public {
        zone monerod_public 64k;
        # "resolve" follows a new monerod IP through the resolver above
        # (nginx 1.27.3 or later).
        # max_conns: at most 32 requests at monerod at a time. The numbers:
        #  - This IP has the cap --rpc-max-connections-per-private-ip=50, so
        #    18 slots stay free for counts that monerod holds for a short time.
        #  - The restricted RPC has the cap --rpc-max-connections=100 for all
        #    sources. This pool (32) and the onion-proxy pool (32) take 64.
        #    36 stay for /health of nginx, the probes and short-held counts.
        #  - monerod serves 2 requests at a time (2 RPC threads), so 32 is a
        #    deep queue: about 2 to 4 s at the US peak of 11 requests per s.
        # When 32 requests wait for monerod, nginx answers the next request
        # at once with a 502 ("no live upstreams" in the error log), and
        # monerod never sees it. Public Proxy Pool High fires above 25
        # sockets, and Critical at 30.
        server monerod:18089 resolve max_conns=32;
        # Keep every pool socket when it goes idle: no new socket after a burst
        keepalive 32;
        # Close idle sockets before monerod does (30 min for private IPs)
        keepalive_timeout 300s;
        # nginx closes a socket after 1 h by default, so keep them for days
        keepalive_time 7d;
        keepalive_requests 10000000;
    }

    server {
        listen unix:/run/nginx-tls.sock ssl;

        # The cert of the box (certbot-conf, read only), for any SNI.
        # nginx loads it at start and at "nginx -s reload". The daily cron
        # scripts/cert-reload.sh reloads it after a renewal.
        ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:public_tls:10m;
        ssl_session_timeout 1h;

        location / {
            proxy_pass https://monerod_public;
            proxy_http_version 1.1;
            # An empty Connection header keeps the monerod connection open
            proxy_set_header Connection "";

            # Internal hop. The cert names the public domain, not "monerod".
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_ssl_session_reuse on;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            # Let slow replies finish, so a timeout does not cut a socket
            proxy_read_timeout 300s;

            # Finish the monerod call even when the client goes away, so
            # monerod always sees a clean close. Never retry a call.
            proxy_ignore_client_abort on;
            proxy_next_upstream off;

            # Read each reply to the end at LAN speed, and keep the socket in
            # the pool. Then the client gets the reply from here at its own
            # pace. proxy_ignore_client_abort covers only a client that goes
            # away while nginx waits for monerod. When a client goes away
            # while nginx sends the reply, nginx closes the monerod socket in
            # the middle of the reply, unless it stores the reply. So store
            # each reply: nginx writes it to a temp file and renames it to
            # last-reply (the last reply only). The temp files are on the
            # /var/cache/nginx tmpfs (1 GiB, docker-compose.yml). The path
            # must be on the same tmpfs as proxy_temp, and nginx must own the
            # directory.
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 16 64k;
            proxy_busy_buffers_size 256k;
            proxy_store /var/cache/nginx/proxy_temp/last-reply;
        }
    }
}
