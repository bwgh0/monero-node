services:
  monerod:
    # simple-monerod, pinned by the digest of its multi-arch index. Deploy a
    # change to this line alone (mixed_data_guard in scripts/deploy.sh).
    image: ghcr.io/sethforprivacy/simple-monerod:v0.18.4.5@sha256:b28d208602ab5a74685a799f338236113f45cf7972b510ad67666643e0e4a0f3
    container_name: monerod
    restart: unless-stopped
    volumes:
      - bitmonero:/home/monero/.bitmonero
      - certbot-conf:/etc/letsencrypt:ro
    command:
      # Unrestricted RPC on 18081 — internal only (exporter uses this)
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      # Restricted RPC on 18089 — public-facing with native TLS
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --confirm-external-bind
      # Native TLS with Let's Encrypt cert (same approach as Cake Wallet's node).
      # monerod's Epee HTTP server handles TLS directly — no nginx proxy needed.
      # wallet2 and monerod share the same OpenSSL, so TLS always negotiates.
      - --rpc-ssl=enabled
      - --rpc-ssl-private-key=/etc/letsencrypt/live/${DOMAIN}/privkey.pem
      - --rpc-ssl-certificate=/etc/letsencrypt/live/${DOMAIN}/fullchain.pem
      - --prune-blockchain
      - --public-node
      - --out-peers=32
      - --in-peers=64
      - --max-connections-per-ip=8
      - --enable-dns-blocklist
      - --ban-list=/home/monero/ban_list.txt
      - --disable-rpc-ban
      # All onion traffic reaches monerod from the onion-proxy IP, and the
      # exporter from the rpc-proxy IP. Default per private IP is 25.
      # Must stay at or below --rpc-max-connections (default 100).
      - --rpc-max-connections-per-private-ip=50
      # Each open wallet holds 1 socket. iOS adds 2 probe sockets per unlock.
      # Homes, VPN exits and carrier NAT share one IP. The default of 3 refuses
      # the 4th socket, and wallet2 then stays on plain HTTP until reopened.
      - --rpc-max-connections-per-public-ip=10
      - --enforce-dns-checkpointing
      # Privacy hardening
      - --pad-transactions
      - --check-updates=disabled
      # Reduce attack surface — ZMQ not used
      - --no-zmq
      # Minimal logging with rotation (size 0 = unlimited; a 0-cap log once grew to 11G)
      - --log-level=0
      - --max-log-file-size=104857600
      - --max-log-files=2
      # Network
      - --no-igd
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=18080
      - --limit-rate-up=128000
      - --limit-rate-down=128000
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "https://localhost:18081/get_height"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "18080:18080"  # P2P
      - "443:18089"    # HTTPS — monerod native TLS (wallet clients connect here)
      - "18089:18089"  # Legacy port — same RPC, kept for existing configs
    networks:
      - public
      - internal
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    # Note: no-new-privileges omitted — sethsimmons image uses fixuid (setuid)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  nginx:
    # nginx, pinned by the digest of its multi-arch index. onion-proxy and
    # monerod-rpc-proxy use the same image.
    image: nginx:1.30-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    ports:
      - "80:80"  # Health checks, ACME, Grafana (port 443 is monerod native TLS)
    depends_on:
      - monerod
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

  certbot:
    # certbot with the Route 53 DNS plugin, pinned by the digest of its
    # multi-arch index. scripts/setup.sh also takes this image from here.
    image: certbot/dns-route53:v3.1.0@sha256:106c888431ea9564e62d7faf58c76b432b97f190f4688b8a6e60549c54aeaddd
    container_name: certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./aws:/root/.aws:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --deploy-hook \"chmod 755 /etc/letsencrypt/live /etc/letsencrypt/archive && chmod -R a+rX /etc/letsencrypt/live/ /etc/letsencrypt/archive/\"; sleep 12h & wait $${!}; done;'"
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

  tor:
    # Tor 0.4.9.14 (BTCPay Server build), pinned by the digest of its
    # multi-arch index (amd64 and arm64).
    # The image entrypoint rewrites its torrc as root, so we skip it and pass
    # the whole config as flags. A config change then recreates the container.
    # Runs as 104:107. That uid owns the onion keys in tor-keys (the old goldy
    # image created them). Never change HiddenServiceDir: the .onion address
    # comes from the keys in that directory.
    image: btcpayserver/tor:0.4.9.14@sha256:9bae23c1156698b21eb04663b9f1583d08e370374cf4c2ce5c78363b2ede46aa
    container_name: tor
    restart: unless-stopped
    user: "104:107"
    read_only: true
    entrypoint: ["tor"]  # PATH lookup: /usr/local/bin on amd64, /usr/bin on arm64
    command:
      # No torrc file. Every option is a flag below.
      - --ignore-missing-torrc
      - -f
      - /nonexistent/torrc
      - --defaults-torrc
      - /nonexistent/torrc-defaults
      - --Log
      - notice stdout
      - --DataDirectory
      - /run/tor/data
      - --SocksPort
      - "0"
      # Onion port 18089 goes to onion-proxy over a unix socket. Tor resolves
      # a host name only once at start, so a socket path is used instead.
      - --HiddenServiceDir
      - /var/lib/tor/hidden_service/monerod
      - --HiddenServicePort
      - 18089 unix:/run/onion/monerod.sock
      # Onion-service metrics for scripts/capacity-metrics.sh. Loopback only:
      # the host script reads it through nsenter and drops the onion label.
      - --MetricsPort
      - 127.0.0.1:9035
      - --MetricsPortPolicy
      - accept 127.0.0.1
    tmpfs:
      - /run/tor:uid=104,gid=107,mode=0700
    volumes:
      - tor-keys:/var/lib/tor/hidden_service
      - onion-sock:/run/onion
    depends_on:
      - onion-proxy
    networks:
      - public
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  onion-proxy:
    # Bridge between the onion and monerod. Plain HTTP and TLS clients both
    # work. It reaches only the restricted RPC (monerod:18089). No host port.
    # See onion-proxy.conf.
    image: nginx:1.30-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: onion-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    # A socket file left from the last run makes bind() fail, so remove it
    entrypoint: ["/bin/sh", "-c", "rm -f /run/onion/monerod.sock && exec nginx -g 'daemon off;'"]
    volumes:
      - ./onion-proxy.conf:/etc/nginx/nginx.conf:ro
      - onion-sock:/run/onion
    depends_on:
      - monerod
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --no-collector.arp
      - --no-collector.infiniband
      - --no-collector.ipvs
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.tapestats
      # With --path.procfs these read the namespace of this container, not
      # the host. scripts/capacity-metrics.sh writes the host network data.
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
      - --no-collector.conntrack
      # Container state from scripts/docker-metrics.sh and capacity data from
      # scripts/capacity-metrics.sh (cron, every minute). The watchdog runs
      # from scripts/watchdog-metrics.py (cron, every 5 minutes).
      - --collector.textfile.directory=/host/root/var/lib/node-exporter/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

  monerod-rpc-proxy:
    image: nginx:1.30-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: monerod-rpc-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    volumes:
      - ./monitoring/rpc-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      monerod:
        condition: service_started
        # nginx resolves monerod once, at start, and a new monerod container
        # can get a new IP. So compose restarts the proxy after monerod.
        restart: true
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

  monero-exporter:
    image: utxobr/monero-exporter@sha256:737413b1054583535e835e1417b61a8d59a4c08723e4a15c61c4249c2a7d69a4
    container_name: monero-exporter
    restart: unless-stopped
    read_only: true
    command: ["--monero-addr", "http://monerod-rpc-proxy:18081"]
    dns: 127.0.0.11
    depends_on:
      - monerod-rpc-proxy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  tor-client:
    # SOCKS proxy for the onion probes in blackbox. It is separate from the
    # tor service, so a stuck onion service cannot hide its own outage.
    image: btcpayserver/tor:0.4.9.14@sha256:9bae23c1156698b21eb04663b9f1583d08e370374cf4c2ce5c78363b2ede46aa
    container_name: tor-client
    restart: unless-stopped
    user: "104:107"
    read_only: true
    entrypoint: ["tor"]  # PATH lookup: /usr/local/bin on amd64, /usr/bin on arm64
    command:
      # No torrc file. Every option is a flag below.
      - --ignore-missing-torrc
      - -f
      - /nonexistent/torrc
      - --defaults-torrc
      - /nonexistent/torrc-defaults
      - --Log
      - notice stdout
      - --DataDirectory
      - /run/tor/data
      # For other containers only. No host port is published.
      - --SocksPort
      - 0.0.0.0:9050
      - --SocksPolicy
      - accept private:*,reject *
    tmpfs:
      - /run/tor:uid=104,gid=107,mode=0700
    networks:
      - public
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  blackbox:
    # Probes both nodes from this box: RPC and served certs on 443 and 18089,
    # both onions over Tor, and both Grafanas. See monitoring/blackbox.yml.
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    container_name: blackbox
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    depends_on:
      - tor-client
    networks:
      - public    # the probes need the internet
      - internal  # Prometheus scrapes it here
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  prometheus:
    # Prometheus, pinned by the digest of its multi-arch index
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 6 months of history for the weekly capacity digest. About 110 MB per
      # 30 days today, so the size cap is only a guard.
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=:9091
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - monero-exporter
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

  grafana:
    # Grafana, pinned by the digest of its multi-arch index
    image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_SERVER_ROOT_URL=http://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Grafana sends a cleared alert to its notifier once. The default sends it
      # again for 15 minutes, and then each update of the group of the box
      # (alerting/policies.yml) lists the alert as CLEARED again.
      - GF_UNIFIED_ALERTING_RESOLVED_ALERT_RETENTION=30s
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internal
      - public
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

volumes:
  bitmonero:
    name: ${MONEROD_VOLUME:-monero-node_bitmonero}
  certbot-conf:
  certbot-www:
  tor-keys:
  onion-sock:
  prometheus-data:
  grafana-data:

networks:
  # Public network — containers that need external/inter-service access
  public:
    driver: bridge
  # Internal network — monitoring stack only (no external access)
  # Only monerod is on both networks, so the unrestricted RPC (18081)
  # is only reachable by monero-exporter and prometheus
  internal:
    driver: bridge
    internal: true
