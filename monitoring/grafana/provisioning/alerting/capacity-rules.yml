        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                max(capacity_process_open_fds{container="monerod"}) / max(capacity_process_fd_soft_limit{container="monerod"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.7]
              refId: C
        for: 10m
        annotations:
          summary: "monerod uses {{ humanizePercentage .Values.B.Value }} of its open-file limit"
          affected: "Nobody yet. At the limit monerod cannot accept connections."
          first_step: "Run grep -E '^capacity_process_(open_fds|fd_soft_limit)' /var/lib/node-exporter/textfile/capacity.prom."
          description: "Add ulimits nofile for monerod in docker-compose.yml. That needs a monerod restart. See monerod File Descriptors High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-monerod-pids
