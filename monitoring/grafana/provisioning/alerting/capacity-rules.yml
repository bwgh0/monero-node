      - uid: alert-monerod-memory
        title: monerod Memory High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Anonymous memory only. The LMDB page cache is file memory and frees itself.
              expr: >-
                max(capacity_cgroup_memory_anon_bytes{container="monerod"}) / max(capacity_cgroup_memory_limit_bytes{container="monerod"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.75]
              refId: C
        for: 15m
        annotations:
          summary: "monerod anonymous memory is {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of its limit"
          affected: "Nobody yet. At the limit the kernel kills monerod, and all wallets drop for 1 to 2 minutes."
          first_step: "Watch capacity_cgroup_memory_anon_bytes in Grafana for an hour."
          description: "Raise mem_limit in docker-compose.yml before an OOM kill. The host has about 7.75 GB. See monerod Memory High in docs/capacity.md."
        labels:
          severity: warning

