      - uid: alert-rpc-close-wait
        title: RPC Sockets Stuck
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # The client closed these sockets, and monerod still holds them
              expr: max by (server) (capacity_rpc_sockets{state="close-wait"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        for: 30m
        annotations:
          summary: '{{ printf "%.0f" .Values.B.Value }} sockets of the {{ .Labels.server }} RPC wait in CLOSE-WAIT'
          affected: "Maybe clearnet RPC users and onion users. The stuck sockets count against the limits."
          first_step: "Note the count and the time since the last monerod restart. When the count grows, restart monerod at a quiet hour: docker compose restart monerod."
          description: "This can be the per-IP count leak in a form that we can see. Add the data to the upstream bug report. See RPC Sockets Stuck in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-disk-30d
        title: Disk Fills Within 30 Days
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Free part of each disk filesystem in 30 days at the trend of the last 7 days
              expr: >-
                predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}[7d], 30 * 86400) / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.15]
              refId: C
        for: 1h
        annotations:
          summary: "{{ .Labels.mountpoint }} passes 85% used within 30 days at the trend of the last 7 days"
          affected: "Nobody yet"
          first_step: "Run docker system df and du -sh /var/lib/docker/volumes/*."
          description: "Plan more disk: a larger server type or a Hetzner volume for the chain. FCMP++ (about March 2027) will make the chain grow faster. See Disk Fills Within 30 Days in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-tor-cpu
        title: Tor CPU High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # CPU cores. Tor does most of its work on one core.
              expr: max(rate(capacity_cgroup_cpu_usage_seconds_total{container="tor"}[10m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.7]
              refId: C
        for: 30m
        annotations:
          summary: 'Tor uses {{ printf "%.2f" .Values.B.Value }} CPU cores'
          affected: "Onion users. Onion connections slow down."
          first_step: "In Grafana look at tor_hs_intro_num_total and tor_hs_intro_rejected_intro_req_count for an introduction flood."
          description: "For a flood, consider HiddenServicePoWDefensesEnabled 1 in the Tor config. See Tor CPU High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-onion-proxy-drops
        title: Onion Proxy Dropping Connections
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # nginx accepted connections that it could not handle
              expr: >-
                max(increase(capacity_onion_proxy_accepts_total[15m])) - max(increase(capacity_onion_proxy_handled_total[15m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 0s
        annotations:
          summary: 'The onion-proxy dropped {{ printf "%.0f" .Values.B.Value }} connections in 15 minutes'
          affected: "Onion users"
          first_step: "Run docker logs --tail 50 onion-proxy and look for worker_connections."
          description: "worker_connections is used up. Raise worker_connections in onion-proxy.conf, and add worker_rlimit_nofile plus ulimits in docker-compose.yml. See Onion Proxy Dropping Connections in docs/capacity.md."
        labels:
          severity: warning
