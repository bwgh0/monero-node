apiVersion: 1

# Capacity alerts: they fire before users notice a limit. Most data comes
# from scripts/capacity-metrics.sh, which cron runs every minute and
# node-exporter reads as a textfile. docs/capacity.md has the limits, the
# runbook for each rule and the list of metrics.
#
# All queries are instant: reduce "last" then takes the value of now.
# A rule with no data stays quiet (noDataState OK). Capacity Metrics Stale
# covers missing data.
# A rule whose query fails keeps its last state (execErrState KeepLast).
# Prometheus Unreachable (rules.yml) alerts when the queries fail.

# Grafana keeps a provisioned rule after it goes out of this file, so delete
# the old rules here. Capacity Digest Missing went out with the weekly digest.
deleteRules:
  - orgId: 1
    uid: alert-digest-missing

groups:
  - orgId: 1
    name: capacity-alerts
    folder: alerts
    interval: 1m
    rules:
      - uid: alert-rpc-conns-high
        title: RPC Connections High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Open sockets of the restricted RPC against --rpc-max-connections.
              # Every source counts: the public-proxy pool, the onion-proxy
              # pool and the probes. Public and onion wallets reach monerod
              # only through the pools, so this is the total load on the cap.
              expr: sum(capacity_rpc_connections{server="restricted"}) / max(capacity_rpc_limit{kind="total"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 10m
        annotations:
          summary: "Public RPC holds {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of its socket limit"
          affected: "Nobody yet. At the limit monerod refuses new sockets from the proxies, and each proxy then answers 502."
          first_step: "Run grep -E '^capacity_rpc_(connections|limit)' /var/lib/node-exporter/textfile/capacity.prom to see the sockets by source."
          description: "The pools and the probes fill monerod's socket limit. The two pools take 64 of 100 at most, so this high means a pool grew or the exporter leaks sockets. Check Public Proxy Pool and Onion RPC Connections. See RPC Connections High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-rpc-conns-critical
        title: RPC Connections Critical
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sum(capacity_rpc_connections{server="restricted"}) / max(capacity_rpc_limit{kind="total"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        for: 5m
        annotations:
          summary: "Public RPC holds {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of its socket limit"
          affected: "Clearnet RPC users and onion users soon. At the limit the proxies answer 502."
          first_step: "Run grep -E '^capacity_rpc_(connections|limit)' /var/lib/node-exporter/textfile/capacity.prom to see the sockets by source."
          description: "Raise --rpc-max-connections and the pool max_conns on both boxes, or move users to the other box. See RPC Connections High in docs/capacity.md."
        labels:
          severity: critical

      - uid: alert-onion-conns-high
        title: Onion RPC Connections High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # All onion wallets reach monerod from the IP of the onion-proxy, so
              # they share the cap --rpc-max-connections-per-private-ip. The
              # onion-proxy pool holds at most 32 of the 50 (onion-proxy.conf).
              # Above 50% means more than 25 sockets.
              expr: >-
                max(capacity_rpc_connections{server="restricted",source="onion"}) / max(capacity_rpc_limit{kind="private_ip"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 10m
        annotations:
          summary: "Onion wallets hold {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the private-IP socket cap"
          affected: "Nobody yet. When the pool of 32 sockets is full, onion-proxy answers each new request with a 502."
          first_step: "Run grep -E '^capacity_(rpc_connections.*onion|rpc_limit|onion_socket_clients)' /var/lib/node-exporter/textfile/capacity.prom to compare the monerod sockets with the Tor clients."
          description: "All onion requests share the onion-proxy pool (max_conns 32 in onion-proxy.conf). A pool this full for 10 minutes means monerod replies slowly or the onion load is high. Check RPC Busy and monerod CPU. See Onion RPC Connections High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-onion-conns-critical
        title: Onion RPC Connections Critical
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                max(capacity_rpc_connections{server="restricted",source="onion"}) / max(capacity_rpc_limit{kind="private_ip"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # 30 sockets or more. The onion-proxy pool stops at 32
                    # (max_conns in onion-proxy.conf), 64% of the cap of 50.
                    params: [0.59]
              refId: C
        for: 5m
        annotations:
          summary: "Onion wallets hold {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the private-IP socket cap"
          affected: "Onion users soon. When the pool of 32 sockets is full, onion-proxy answers each new request with a 502."
          first_step: "Run grep -E '^capacity_(rpc_connections.*onion|rpc_limit|onion_socket_clients)' /var/lib/node-exporter/textfile/capacity.prom to compare the monerod sockets with the Tor clients."
          description: "The onion-proxy pool is almost full: monerod replies slowly, or the onion load is high. Check RPC Busy and monerod CPU. When Onion Down fires while the counts look low, the count leak holds the onion-proxy IP: restart monerod at a quiet hour. See Onion RPC Connections High in docs/capacity.md."
        labels:
          severity: critical

      - uid: alert-public-proxy-pool-high
        title: Public Proxy Pool High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # All public wallets reach monerod from the public-proxy IP, so
              # they share --rpc-max-connections-per-private-ip. The pool holds
              # at most 32 of the 50 (public-proxy.conf). Above 50% is 25.
              expr: >-
                max(capacity_rpc_connections{server="restricted",source="public_proxy"}) / max(capacity_rpc_limit{kind="private_ip"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 10m
        annotations:
          summary: "The public-proxy pool holds {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the private-IP socket cap"
          affected: "Nobody yet. When the pool of 32 sockets is full, public-proxy answers each new request with a 502."
          first_step: "Run grep -E '^capacity_(rpc_connections.*public_proxy|rpc_limit|public_proxy_clients)' /var/lib/node-exporter/textfile/capacity.prom to compare the monerod pool with the wallet clients."
          description: "All public requests share the public-proxy pool (max_conns 32 in public-proxy.conf). A pool this full for 10 minutes means monerod replies slowly or the public load is high. Check RPC Busy and monerod CPU. See Public Proxy Pool High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-public-proxy-pool-critical
        title: Public Proxy Pool Critical
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                max(capacity_rpc_connections{server="restricted",source="public_proxy"}) / max(capacity_rpc_limit{kind="private_ip"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # 30 sockets or more. The pool stops at 32 (max_conns in
                    # public-proxy.conf), 64% of the cap of 50.
                    params: [0.59]
              refId: C
        for: 5m
        annotations:
          summary: "The public-proxy pool holds {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the private-IP socket cap"
          affected: "Clearnet RPC users soon. When the pool of 32 sockets is full, public-proxy answers each new request with a 502."
          first_step: "Run grep -E '^capacity_(rpc_connections.*public_proxy|rpc_limit|public_proxy_clients)' /var/lib/node-exporter/textfile/capacity.prom to compare the monerod pool with the wallet clients."
          description: "The public-proxy pool is almost full: monerod replies slowly, or the public load is high. Check RPC Busy and monerod CPU. See Public Proxy Pool High in docs/capacity.md."
        labels:
          severity: critical

      - uid: alert-rpc-ip-at-cap
        title: Public IP At RPC Cap
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Client IPs at the public-proxy per-IP cap (limit_conn, 10).
              # public-proxy-part reads them from the proxy, not monerod.
              expr: max(capacity_rpc_public_ips_at_cap{server="restricted"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 15m
        annotations:
          summary: '{{ with .Values.B }}{{ printf "%.0f" .Value }}{{ else }}An unknown number of{{ end }} public IP(s) hold as many RPC sockets as the per-IP cap'
          affected: "Clearnet RPC users behind that IP (VPN, carrier NAT). public-proxy refuses their next socket."
          first_step: "Run grep -E '^capacity_rpc_(public|limit)' /var/lib/node-exporter/textfile/capacity.prom."
          description: "A flat line at the cap means a shared IP or one busy client. public-proxy enforces the per-IP cap now, so one IP can no longer lock out monerod. A refused socket is a wallet behind a busy shared IP. See Public IP At RPC Cap in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-rpc-churn
        title: RPC Clients Reconnecting
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Client IPs with 4 or more sockets that public-proxy closed in
              # the last minute (read from the proxy by public-proxy-part).
              expr: max(capacity_rpc_churn_ips{server="restricted"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        annotations:
          summary: '{{ with .Values.B }}{{ printf "%.0f" .Value }}{{ else }}An unknown number of{{ end }} public IP(s) connect to the RPC again and again'
          affected: "Clearnet RPC users behind those IPs. Their wallets do not sync."
          first_step: "Look for a Public IP At RPC Cap or Public Proxy Pool alert first. A refusal comes before the reconnects."
          description: "This is the pattern of a wallet behind a shared IP at the per-IP cap that retries, or of a wallet that sends plain HTTP to the TLS port every 10 s. The reconnects end at public-proxy now, not monerod. See RPC Clients Reconnecting in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-rpc-busy-high
        title: RPC Busy High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Busy time of the 2 RPC threads of the public server (hardcoded in
              # monerod). The methods of monero-exporter run on the other server.
              expr: >-
                sum(rate(monero_rpc_seconds_total{job="monerod",method!~"get_connections|get_peer_list|get_net_stats|get_transaction_pool|get_transaction_pool_stats|rpc_access_tracking|get_block|get_last_block_header"}[5m])) / 2
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 15m
        annotations:
          summary: "The 2 RPC threads are busy {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the time"
          affected: "Clearnet RPC users and onion users. Requests wait, so wallets sync slowly."
          first_step: "In Grafana Explore run topk(5, sum by (method) (rate(monero_rpc_seconds_total[5m]))) to find the method."
          description: "get_blocks means wallet restores or catch-up. Short restore waves pass. For lasting load, move users to the other box or add a node. See RPC Busy High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-rpc-busy-critical
        title: RPC Busy Critical
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                sum(rate(monero_rpc_seconds_total{job="monerod",method!~"get_connections|get_peer_list|get_net_stats|get_transaction_pool|get_transaction_pool_stats|rpc_access_tracking|get_block|get_last_block_header"}[5m])) / 2
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        for: 10m
        annotations:
          summary: "The 2 RPC threads are busy {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the time"
          affected: "Clearnet RPC users and onion users. Requests queue, and wallets time out."
          first_step: "In Grafana Explore run topk(5, sum by (method) (rate(monero_rpc_seconds_total[5m]))) to find the method."
          description: "The thread count is fixed in the monerod build. Move users to the other box or add a node. See RPC Busy High in docs/capacity.md."
        labels:
          severity: critical

      - uid: alert-traffic-projection
        title: Monthly Traffic High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Egress of this month (UTC) at the pace so far, against the included
              # traffic. Quiet on days 1 to 3, when the pace is not yet stable.
              expr: >-
                (max(capacity_host_tx_month_bytes) / ((day_of_month() - 1 + hour() / 24) / days_in_month()) / max(capacity_traffic_included_bytes)) and on() (day_of_month() >= 4)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        for: 1h
        annotations:
          summary: "At this pace the month uses {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the included traffic"
          affected: "Nobody. Traffic above the included amount costs money."
          first_step: "Split the egress in Grafana: P2P is monero_net_tx_bytes, RPC and Tor are capacity_netns_network_bytes_total."
          description: "Hetzner bills outgoing traffic only. For P2P cost, lower --limit-rate-up. For RPC growth, accept the cost or move the box to an EU location. See Monthly Traffic High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-traffic-over
        title: Included Traffic Used Up
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: max(capacity_host_tx_month_bytes) / max(capacity_traffic_included_bytes)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
              refId: C
        for: 1h
        annotations:
          summary: "This month used {{ with .Values.B }}{{ humanizePercentage .Value }}{{ else }}an unknown share{{ end }} of the included traffic"
          affected: "Nobody. Each TB above the included amount costs money."
          first_step: "Split the egress in Grafana: P2P is monero_net_tx_bytes, RPC and Tor are capacity_netns_network_bytes_total."
          description: "The count starts again on the 1st of the month (UTC). See Monthly Traffic High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-oom-kill
        title: OOM Kill
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Kills on the whole host. The cgroup counter misses the kill of the
              # main process of a container, because its cgroup goes away with it.
              expr: max(increase(node_vmstat_oom_kill[10m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        annotations:
          summary: "The kernel killed a process for lack of memory"
          affected: "Users of that container. Docker restarts it. A monerod restart drops all wallets for 1 to 2 minutes."
          first_step: "Run journalctl -k --since -1h | grep -i 'killed process' to find the process."
          description: "Container Crashed fires too when Docker restarts the container. Check capacity_cgroup_memory_anon_bytes before the kill and the logs of the container. Raise mem_limit when the use is real growth. See OOM Kill in docs/capacity.md."
        labels:
          severity: critical

      - uid: alert-capacity-stale
        title: Capacity Metrics Stale
        condition: C
        noDataState: Alerting
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # A missing file gives 1e9, so that alerts too. 0 while node-exporter
              # is down: System Exporter Down covers that.
              expr: >-
                ((time() - max(capacity_metrics_last_run_timestamp_seconds)) or vector(1e9)) * on() (max(up{job="node"}) == bool 1)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [300]
              refId: C
        for: 5m
        annotations:
          summary: "The capacity metrics are older than 5 minutes"
          affected: "Monitoring only. The capacity alerts are blind."
          first_step: "Run bash /opt/monero-node/scripts/capacity-metrics.sh by hand to see the error."
          description: "The cron job /etc/cron.d/monero-node-capacity has not updated /var/lib/node-exporter/textfile/capacity.prom. Check the cron entry and the textfile directory. See Capacity Metrics Stale in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-capacity-broken
        title: Capacity Metrics Broken
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Each part of scripts/capacity-metrics.sh reports 1 when it passed.
              # The parts of a stopped container do not run: Container Down covers it.
              expr: min by (part) (capacity_metrics_parse_ok)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 15m
        annotations:
          summary: "Part {{ .Labels.part }} of the capacity metrics fails"
          affected: "Monitoring only. The capacity alerts of that part are blind."
          first_step: "Run bash /opt/monero-node/scripts/capacity-metrics.sh by hand to see the error."
          description: "A part fails when a tool or a file that it reads is missing. The other parts still run. See Capacity Metrics Stale in docs/capacity.md."
        labels:
          severity: warning

  # Group 2: use of the host and the containers
  - orgId: 1
    name: capacity-use-alerts
    folder: alerts
    interval: 1m
    rules:
      - uid: alert-egress-rate
        title: Egress Rate High
        condition: C
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Bits per second out of the host, only while the pace would send 5 times
              # this box's included traffic in 30 days: 51 Mbit/s with 3 TiB, 339 Mbit/s
              # with 20 TiB. Empty below that, and noDataState OK keeps it quiet.
              expr: max(rate(capacity_host_network_bytes_total{direction="tx"}[30m])) * 8 > 5 * max(capacity_traffic_included_bytes) * 8 / 2592000
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30m
        annotations:
          summary: "The host sends {{ with .Values.B }}{{ humanize .Value }}bit/s{{ else }}at an unknown rate{{ end }}"
          affected: "Nobody yet. At this pace the month uses far more than the included traffic."
          first_step: "Split the egress by container in Grafana with capacity_netns_network_bytes_total."
          description: "P2P peaks come from peers that sync from this node. RPC peaks come from wallet restores. For one client, look for Public IP At RPC Cap. For P2P, consider --limit-rate-up. See Egress Rate High in docs/capacity.md."
        labels:
          severity: warning

      - uid: alert-monerod-cpu
