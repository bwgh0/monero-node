apiVersion: 1

groups:
  - orgId: 1
    name: node-alerts
    folder: alerts
    interval: 1m
    rules:
      - uid: alert-node-down
        title: Node Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up{job="monerod"}
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 2m
        annotations:
          summary: "monerod exporter is down — node may be offline"
        labels:
          severity: critical

      - uid: alert-cpu-high
        title: CPU Usage High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        for: 10m
        annotations:
          summary: "CPU usage above 90% for 10 minutes"
        labels:
          severity: warning

      - uid: alert-ram-high
        title: RAM Usage High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        for: 5m
        annotations:
          summary: "RAM usage above 90% for 5 minutes"
        labels:
          severity: warning

      - uid: alert-disk-high
        title: Disk Usage Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]
              refId: C
        for: 5m
        annotations:
          summary: "Disk usage above 85% — monerod will crash if disk fills"
        labels:
          severity: critical

      - uid: alert-node-behind
        title: Node Falling Behind
        condition: C
        noDataState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Only evaluate when target_height > 0 (node is actively syncing).
              # When synced, target_height = 0 so this returns empty — handled by noDataState: OK.
              expr: (monero_info_target_height - monero_info_height) and monero_info_target_height > 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
              refId: C
        for: 30m
        annotations:
          summary: "Node is more than 100 blocks behind for 30+ minutes"
        labels:
          severity: warning

      - uid: alert-system-exporter-down
        title: System Exporter Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up{job="node"}
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 2m
        annotations:
          summary: "System metrics exporter is down"
        labels:
          severity: critical
