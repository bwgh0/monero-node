# Plain HTTP proxy for monero-exporter, which calls monerod's TLS RPC on 18081.
#
# Keep a pool of persistent TLS connections to monerod, and never reset one
# while monerod writes a reply. In monerod v0.18.4.5 and v0.18.5.4, a peer
# reset during a reply leaves the socket stuck until monerod's idle timer
# fires: 30 min for a private IP such as this proxy, 5 min for a public IP.
# The stuck socket keeps its slot in the per-IP limit (50) for that time.
# Lab test 2026-10-18: pipelined requests, then a reset, held 20 of 20 slots;
# the idle timer freed all of them. Clean closes (FIN, close_notify, client
# abort before the reply, Connection: close, HTTP/1.0) held no slot.
# With a new connection per request (about 10 per scrape), this proxy's IP
# reached the 50 limit about 25 min after each monerod restart.
worker_processes 1;
events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;

    upstream monerod_rpc {
        server monerod:18081;
        keepalive 16;
        # Longer than the 30 s scrape interval, shorter than monerod's
        # 30 min idle timeout for private IPs, so nginx closes first.
        keepalive_timeout 300s;
        # monerod v0.18.4.5 leaks its per-IP socket count when a socket
        # closes, so close them as seldom as we can. Without these lines nginx
        # closes each socket after 1 h, and the EU box locked the exporter out
        # after about 10 h (2026-10-17).
        keepalive_time 7d;
        keepalive_requests 10000000;
    }

    server {
        listen 18081;

        location / {
            proxy_pass https://monerod_rpc;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The exporter cancels its other requests when one request fails
            # (about 15 NUL decode errors per hour). Without this line, nginx
            # then closes the upstream socket during monerod's reply, and the
            # reset holds a per-IP slot for 30 min. With it, nginx reads the
            # whole reply and keeps the socket in the pool.
            proxy_ignore_client_abort on;
            # Let slow replies finish, so a timeout does not reset the socket.
            proxy_read_timeout 300s;
        }
    }
}
