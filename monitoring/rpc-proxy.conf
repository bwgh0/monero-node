# Plain HTTP proxy for monero-exporter, which calls monerod's TLS RPC on 18081.
#
# Keep a pool of persistent TLS connections to monerod. monerod v0.18.4.5
# leaks its per-IP RPC connection count under load: the count goes up on
# accept and sometimes never comes back down. With a new connection per
# request (about 10 per scrape), this proxy's IP reached the 50 limit about
# 25 min after each monerod restart, and monerod then refused it until the
# next restart. Reused connections leave almost nothing to leak.
worker_processes 1;
events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;

    upstream monerod_rpc {
        server monerod:18081;
        keepalive 16;
        # Longer than the 30 s scrape interval, shorter than monerod's
        # 30 min idle timeout for private IPs, so nginx closes first.
        keepalive_timeout 300s;
        keepalive_requests 100000;
    }

    server {
        listen 18081;

        location / {
            proxy_pass https://monerod_rpc;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
